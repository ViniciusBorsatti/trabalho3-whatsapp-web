<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conectar computador – WhatsApp Web</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/conectar.css">
  <script src="js/tema.js"></script>
  <script src="js/conectar.js" defer></script>
</head>
<body>
  <div class="conectar-pagina">
    <div class="conectar-celular">
      <header class="conectar-cabecalho">
        <i class="bi bi-whatsapp logo-icone" aria-hidden="true"></i>
        <nav aria-label="Navegação de acesso">
          <a href="index.html">Voltar ao início</a>
        </nav>
      </header>

      <main class="conectar-conteudo">
        <section class="cartao-conectar" aria-labelledby="titulo-conectar">
          <h1 id="titulo-conectar">Conectar a um computador?</h1>

          <article class="aparelho" aria-label="Aparelho que será conectado">
            <i class="bi bi-laptop aparelho-icone" aria-hidden="true"></i>
            <div class="aparelho-info">
              <p class="aparelho-nome">Google Chrome no Windows</p>
              <p class="aparelho-detalhe">Concórdia, SC</p>
              <p class="aparelho-detalhe" id="aparelho-hora"></p>
            </div>
          </article>

          <p class="contagem" id="contagem">O QR code expira em 60 s</p>
          <p class="msg-erro-geral" id="erro-conexao" role="alert"></p>
          <button type="button" class="btn btn-secundario btn-novo-qr" id="btn-novo-qr" hidden>Gerar novo QR code</button>

          <div class="acoes-conectar">
            <button type="button" class="btn btn-secundario" id="btn-cancelar">Cancelar</button>
            <button type="button" class="btn btn-primario" id="btn-conectar">Conectar</button>
          </div>
        </section>
      </main>

      <footer class="rodape-aviso">Clone do WhatsApp Web para fins educacionais, sem vínculo com o WhatsApp ou a Meta. Todos os dados são fictícios.</footer>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
