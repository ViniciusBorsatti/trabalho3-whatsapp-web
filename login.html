<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar – WhatsApp Web</title>
  <!-- Ícones do Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Estilo global: variáveis de cor e fonte, tema e componentes -->
  <link rel="stylesheet" href="css/style.css">
  <!-- Estilo específico desta página -->
  <link rel="stylesheet" href="css/login.css">
  <!-- Tema claro/escuro, carregado antes do conteúdo -->
  <script src="js/tema.js"></script>
  <!-- Validação e mostrar/ocultar senha, executados após o HTML -->
  <script src="js/login.js" defer></script>
</head>
<body>
  <div class="login-pagina">
    <!-- Cabeçalho com logo e link de volta ao início -->
    <header class="login-cabecalho">
      <i class="bi bi-whatsapp logo-icone" aria-hidden="true"></i>
      <nav aria-label="Navegação de acesso">
        <a href="index.html">Voltar ao início</a>
      </nav>
    </header>

    <main class="login-conteudo">
      <!-- Cartão central com o formulário de login -->
      <section class="cartao-login" aria-labelledby="titulo-login">
        <h1 id="titulo-login">Entrar</h1>

        <!-- Mensagem geral de erro, exibida acima do formulário -->
        <p class="msg-erro-geral" id="erro-geral" role="alert"></p>

        <!-- novalidate desliga a validação nativa; a validação fica no JS -->
        <form id="form-login" novalidate>
          <!-- Telefone: o pattern garante o formato (49) 99999-0001 -->
          <div class="grupo-campo">
            <label for="telefone">Telefone</label>
            <input type="tel" class="campo" id="telefone" autocomplete="tel" placeholder="(49) 99999-0001" pattern="\([0-9]{2}\)\s[0-9]{5}-[0-9]{4}" required aria-describedby="erro-telefone">
            <p class="msg-erro" id="erro-telefone"></p>
          </div>

          <!-- Senha com botão para mostrar ou ocultar o texto -->
          <div class="grupo-campo">
            <label for="senha">Senha</label>
            <div class="senha-campo">
              <input type="password" class="campo" id="senha" autocomplete="current-password" required aria-describedby="erro-senha">
              <button type="button" class="btn-mostrar-senha" id="btn-mostrar-senha" aria-label="Mostrar senha" aria-pressed="false" aria-controls="senha">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <p class="msg-erro" id="erro-senha"></p>
          </div>

          <button type="submit" class="btn btn-primario">Entrar</button>
        </form>

        <p class="login-rodape-link">
          Não tem uma conta? <a href="cadastro.html">Criar conta</a>
        </p>
      </section>
    </main>

    <!-- Aviso de clone educacional, com dados fictícios -->
    <footer class="rodape-aviso">Clone do WhatsApp Web para fins educacionais, sem vínculo com o WhatsApp ou a Meta. Todos os dados são fictícios.</footer>
  </div>

  <!-- Área das mensagens de sucesso (toast) -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
