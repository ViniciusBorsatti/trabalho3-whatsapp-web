<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta – WhatsApp Web</title>
  <!-- Ícones do Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Estilo global: variáveis de cor e fonte, tema e componentes -->
  <link rel="stylesheet" href="css/style.css">
  <!-- Estilo específico desta página -->
  <link rel="stylesheet" href="css/cadastro.css">
  <!-- Tema claro/escuro, carregado antes do conteúdo -->
  <script src="js/tema.js"></script>
  <!-- Validação do formulário, executada após o HTML ser lido -->
  <script src="js/cadastro.js" defer></script>
</head>
<body>
  <div class="cadastro-pagina">
    <!-- Cabeçalho com logo e link de volta ao início -->
    <header class="cadastro-cabecalho">
      <i class="bi bi-whatsapp logo-icone" aria-hidden="true"></i>
      <nav aria-label="Navegação de acesso">
        <a href="index.html">Voltar ao início</a>
      </nav>
    </header>

    <main class="cadastro-conteudo">
      <!-- Cartão central com o formulário de cadastro -->
      <section class="cartao-cadastro" aria-labelledby="titulo-cadastro">
        <h1 id="titulo-cadastro">Criar conta</h1>

        <!-- novalidate desliga a validação nativa do navegador; a validação fica no JS -->
        <form id="form-cadastro" novalidate>
          <!-- Nome: campo obrigatório -->
          <div class="grupo-campo">
            <label for="nome">Nome completo</label>
            <input type="text" class="campo" id="nome" autocomplete="name" required aria-describedby="erro-nome">
            <p class="msg-erro" id="erro-nome"></p>
          </div>

          <!-- Telefone: o pattern garante o formato (49) 99999-0001 -->
          <div class="grupo-campo">
            <label for="telefone">Telefone</label>
            <input type="tel" class="campo" id="telefone" autocomplete="tel" placeholder="(49) 99999-0001" pattern="\([0-9]{2}\)\s[0-9]{5}-[0-9]{4}" required aria-describedby="erro-telefone">
            <p class="msg-erro" id="erro-telefone"></p>
          </div>

          <!-- E-mail: type="email" já ajuda o navegador a validar o formato -->
          <div class="grupo-campo">
            <label for="email">E-mail</label>
            <input type="email" class="campo" id="email" autocomplete="email" required aria-describedby="erro-email">
            <p class="msg-erro" id="erro-email"></p>
          </div>

          <!-- Senha: minlength define o mínimo de 8 caracteres -->
          <div class="grupo-campo">
            <label for="senha">Senha</label>
            <input type="password" class="campo" id="senha" autocomplete="new-password" minlength="8" required aria-describedby="erro-senha">
            <p class="msg-erro" id="erro-senha"></p>
          </div>

          <!-- Confirmação: o JS compara com a senha digitada -->
          <div class="grupo-campo">
            <label for="confirma-senha">Confirmar senha</label>
            <input type="password" class="campo" id="confirma-senha" autocomplete="new-password" required aria-describedby="erro-confirma-senha">
            <p class="msg-erro" id="erro-confirma-senha"></p>
          </div>

          <button type="submit" class="btn btn-primario">Cadastrar</button>
        </form>

        <p class="cadastro-rodape-link">
          Já tem uma conta? <a href="login.html">Entrar</a>
        </p>
      </section>
    </main>

    <!-- Aviso de clone educacional, com dados fictícios -->
    <footer class="rodape-aviso">Clone do WhatsApp Web para fins educacionais, sem vínculo com o WhatsApp ou a Meta. Todos os dados são fictícios.</footer>
  </div>

  <!-- Área das mensagens de sucesso (toast) -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
